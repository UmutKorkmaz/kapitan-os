# GitHub Pages Jekyll Configuration
title: "KAPiTaN OS"
description: "Turkish Command-Layer Linux Distribution"
theme: jekyll-theme-slate
url: "https://umutkorkmaz.github.io/kapitan-os"

# Markdown processor
markdown: kramdown
highlighter: rouge

# Site metadata
author: "Umut Korkmaz"
repository: "UmutKorkmaz/kapitan-os"

# Exclude from processing
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - "*.gemspec"

# Navigation
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Build settings
show_excerpts: true
paginate: 10
