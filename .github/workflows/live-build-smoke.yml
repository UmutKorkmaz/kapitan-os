name: live-build-smoke

# Least privilege by default; only the release-publishing job escalates.
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build/**'
      - 'distro/**'
      - 'packages/kapitan-sh/**'
      - 'packages/commands/**'
      - '.github/workflows/live-build-smoke.yml'
      - 'package.json'
      - 'Makefile'

jobs:
  sync-and-dry-run:
    name: 'Sync & Dry-Run [${{ matrix.edition }}]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [bar, ofis, gelistirici]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commands
        run: npm run validate:commands

      - name: Sync ISO image assets [${{ matrix.edition }}]
        env:
          KAPITAN_EDITION: ${{ matrix.edition }}
        run: npm run sync:iso-assets

      - name: Verify includes.chroot layout [${{ matrix.edition }}]
        env:
          KAPITAN_EDITION: ${{ matrix.edition }}
        run: |
          set -euo pipefail
          base=build/live-build/config/includes.chroot
          test -f "$base/usr/share/kapitan/commands.json"
          test -f "$base/usr/share/kapitan/kapitan-sh/kapitan-sh"
          test -f "$base/usr/share/kapitan/kapitan-sh/lib/resolve.sh"
          test -x "$base/usr/local/bin/kapitan-sh"
          test -f "$base/etc/os-release"
          test -f "$base/etc/kapitan/VERSION"
          grep -q 'KAPiTaN OS' "$base/etc/os-release"
          grep -q 'KAPITAN_COMMANDS_JSON' "$base/etc/profile.d/kapitan.sh"
          # Verify the edition-specific package list exists
          test -f "build/live-build/config/package-lists/${KAPITAN_EDITION}.list.chroot"
          test -f "build/live-build/config/package-lists/kapitan-base.list.chroot"
          jq -e '.path_guard | length > 0' "$base/usr/share/kapitan/commands.json" >/dev/null
          echo "includes.chroot layout OK for edition: ${KAPITAN_EDITION}"

      - name: Install live-build (dry-run prerequisites)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap jq wget debian-archive-keyring
          curl -fsSL -o /tmp/live-build.deb \
            http://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          sudo dpkg -i /tmp/live-build.deb
          lb --version

      - name: Dry-run ISO build [${{ matrix.edition }}]
        env:
          KAPITAN_EDITION: ${{ matrix.edition }}
        run: npm run dry-run:iso

  # Full ISO build — manual or tag-triggered (long-running, needs ~15GB disk)
  build-iso:
    name: 'Build ISO [${{ matrix.edition }}]'
    runs-on: ubuntu-latest
    needs: sync-and-dry-run
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 180
    # Only this job publishes ISOs; escalated to write for future release step.
    permissions:
      contents: write
    strategy:
      matrix:
        edition: [bar, ofis, gelistirici]
      fail-fast: false
    env:
      KAPITAN_EDITION: ${{ matrix.edition }}
      KAPITAN_MIRROR: http://deb.debian.org/debian
      KAPITAN_SECURITY_MIRROR: http://deb.debian.org/debian-security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso isolinux syslinux-common ovmf jq wget debian-archive-keyring
          curl -fsSL -o /tmp/live-build.deb \
            http://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          sudo dpkg -i /tmp/live-build.deb
          lb --version
          npm ci
          npm run validate:commands
          npm run sync:iso-assets

      - name: Build ISO [${{ matrix.edition }}]
        run: sudo -E bash build/live-build/build.sh

      - name: Verify ISO artifact [${{ matrix.edition }}]
        run: |
          set -euo pipefail
          iso="build/artifacts/kapitan-${KAPITAN_EDITION}-v0.1.0-alpha-amd64.iso"
          sudo chown -R "$(id -u):$(id -g)" build/artifacts
          test -f "$iso"
          size=$(stat -c%s "$iso")
          test "$size" -gt 104857600
          sha256sum "$iso" | tee "$iso.sha256"
          echo "ISO size: $size bytes"

      - name: Upload ISO artifact [${{ matrix.edition }}]
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.edition }}-${{ github.run_id }}
          path: build/artifacts/kapitan-${{ matrix.edition }}-v0.1.0-alpha-amd64.iso
          retention-days: 7

      # Stage 4 (publish-release) deferred: aggregating all 3 ISOs into a single
      # GitHub Release requires a downstream job after the matrix completes.
      # See: docs/KAPiTaN OS BUILD PLAN.md — Stage 4

  smoke-dual-boot:
    name: 'QEMU Dual-Boot Smoke [${{ matrix.edition }}]'
    runs-on: ubuntu-latest
    needs: build-iso
    if: always()
    strategy:
      matrix:
        edition: [bar, ofis, gelistirici]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          # Enumerate installed OVMF files so path detection failures self-document
          echo "=== Installed OVMF files ==="
          find /usr/share/OVMF /usr/share/edk2-ovmf /usr/share/edk2 -name '*.fd' 2>/dev/null | sort || true

      - name: Download ISO artifact [${{ matrix.edition }}]
        uses: actions/download-artifact@v4
        with:
          name: iso-${{ matrix.edition }}-${{ github.run_id }}
          path: build/artifacts

      - name: Run dual-boot smoke test [${{ matrix.edition }}]
        env:
          KAPITAN_EDITION: ${{ matrix.edition }}
          # Ubuntu 24.04 runners have no nested KVM; give each firmware mode
          # 5 minutes to emit a kernel/init serial marker without acceleration.
          KAPITAN_SMOKE_TIMEOUT: 300
        run: |
          bash build/scripts/qemu-smoke.sh --mode both

      - name: Upload smoke report [${{ matrix.edition }}]
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.edition }}-${{ github.run_id }}
          path: build/smoke-logs/SMOKE-*.md
          if-no-files-found: ignore
