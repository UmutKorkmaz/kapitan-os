name: live-build-smoke

# Least privilege by default; only the release-publishing job escalates.
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build/**'
      - 'distro/**'
      - 'packages/kapitan-sh/**'
      - 'packages/commands/**'
      - '.github/workflows/live-build-smoke.yml'
      - 'package.json'
      - 'Makefile'

jobs:
  sync-and-dry-run:
    name: sync-iso-assets + dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commands
        run: npm run validate:commands

      - name: Sync ISO image assets
        run: npm run sync:iso-assets

      - name: Verify includes.chroot layout
        run: |
          set -euo pipefail
          base=build/live-build/config/includes.chroot
          test -f "$base/usr/share/kapitan/commands.json"
          test -f "$base/usr/share/kapitan/kapitan-sh/kapitan-sh"
          test -f "$base/usr/share/kapitan/kapitan-sh/lib/resolve.sh"
          test -x "$base/usr/local/bin/kapitan-sh"
          test -f "$base/etc/os-release"
          test -f "$base/etc/kapitan/VERSION"
          grep -q 'KAPiTaN OS' "$base/etc/os-release"
          grep -q 'KAPITAN_COMMANDS_JSON' "$base/etc/profile.d/kapitan.sh"
          test -f build/live-build/config/package-lists/kapitan.list.chroot
          jq -e '.path_guard | length > 0' "$base/usr/share/kapitan/commands.json" >/dev/null
          echo "includes.chroot layout OK"

      - name: Install live-build (dry-run prerequisites)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap jq wget debian-archive-keyring
          curl -fsSL -o /tmp/live-build.deb \
            http://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          sudo dpkg -i /tmp/live-build.deb
          lb --version

      - name: Dry-run ISO build wrapper
        run: npm run dry-run:iso

  # Full ISO build — manual only (long-running, needs ~15GB disk)
  build-iso:
    name: build-iso (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Only this manual job publishes the ISO to a GitHub Release.
    permissions:
      contents: write
    env:
      KAPITAN_MIRROR: http://deb.debian.org/debian
      KAPITAN_SECURITY_MIRROR: http://deb.debian.org/debian-security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso isolinux syslinux-common ovmf jq wget debian-archive-keyring
          curl -fsSL -o /tmp/live-build.deb \
            http://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          sudo dpkg -i /tmp/live-build.deb
          lb --version
          npm ci
          npm run validate:commands
          npm run sync:iso-assets

      - name: Build ISO
        run: sudo -E bash build/live-build/build.sh

      - name: Verify ISO artifact
        run: |
          set -euo pipefail
          iso=build/artifacts/kapitan-v0.1.0-alpha-amd64.iso
          sudo chown -R "$(id -u):$(id -g)" build/artifacts
          test -f "$iso"
          size=$(stat -c%s "$iso")
          test "$size" -gt 104857600
          sha256sum "$iso" | tee "$iso.sha256"
          echo "ISO size: $size bytes"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kapitan-v0.1.0-alpha-amd64
          path: build/artifacts/kapitan-v0.1.0-alpha-amd64.iso
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.1.0-alpha"
          iso="build/artifacts/kapitan-v0.1.0-alpha-amd64.iso"
          notes="$(mktemp)"
          {
            echo "## KAPiTaN OS 0.1.0-alpha"
            echo ""
            echo "F1 alpha skeleton — Debian 12 bookworm amd64 live ISO."
            echo ""
            echo "### SHA-256"
            echo '```'
            cat "build/artifacts/kapitan-v0.1.0-alpha-amd64.iso.sha256"
            echo '```'
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$iso" --clobber
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" "$iso" --title "KAPiTaN OS 0.1.0-alpha" --notes-file "$notes"
          fi
  smoke-dual-boot:
    name: QEMU Dual-Boot Smoke Test (BIOS + UEFI)
    runs-on: ubuntu-latest
    needs: build-iso
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          # Enumerate installed OVMF files so path detection failures self-document
          echo "=== Installed OVMF files ==="
          find /usr/share/OVMF /usr/share/edk2-ovmf /usr/share/edk2 -name '*.fd' 2>/dev/null | sort || true

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: kapitan-v0.1.0-alpha-amd64
          path: build/artifacts

      - name: Run dual-boot smoke test
        env:
          # Ubuntu 24.04 runners have no nested KVM; give each firmware mode
          # 5 minutes to emit a kernel/init serial marker without acceleration.
          KAPITAN_SMOKE_TIMEOUT: 300
        run: |
          bash build/scripts/qemu-smoke.sh --mode both

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_id }}
          path: build/smoke-logs/SMOKE-*.md
